<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="ch2_title">2. Strahlung</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .source-btn { width: 100%; margin-bottom: 5px; }
        .source-btn.active { background-color: #2ecc71; }

        .shield-btn { width: 100%; margin-bottom: 5px; background-color: #95a5a6; }
        .shield-btn.active { background-color: #34495e; }

        #desc-box {
            margin-top: 15px;
            font-size: 0.9em;
            color: #2c3e50;
            background: #ecf0f1;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="chapter-container">
        <header>
            <div>
                <a href="index.html" class="btn back-btn" data-i18n="back_to_menu">Zurück zum Menü</a>
                <span data-i18n="ch2_title">2. Strahlung</span>
            </div>
            <div class="language-selector">
                <select onchange="setLanguage(this.value)">
                    <option value="de">Deutsch</option>
                    <option value="en">English</option>
                    <option value="uk">Українська</option>
                </select>
            </div>
            <div class="points-display">
                <span data-i18n="points">Punkte:</span> <span id="points-display">0</span>
            </div>
        </header>

        <div class="scene-container" id="canvas-container">
            <!-- UI Overlay Left -->
            <div class="ui-overlay">
                <p data-i18n="ch2_instruction">Welche Abschirmung stoppt welche Strahlung?</p>

                <h4 style="margin-bottom: 5px;">Quelle:</h4>
                <button class="btn source-btn active" id="btn-src-alpha" onclick="setSource('alpha')" data-i18n="alpha">Alpha (α)</button>
                <button class="btn source-btn" id="btn-src-beta" onclick="setSource('beta')" data-i18n="beta">Beta (β)</button>
                <button class="btn source-btn" id="btn-src-gamma" onclick="setSource('gamma')" data-i18n="gamma">Gamma (γ)</button>

                <div id="desc-box"></div>
            </div>

            <!-- UI Overlay Right -->
            <div class="ui-overlay-right">
                <h4 style="margin-bottom: 5px;">Abschirmung einsetzen:</h4>
                <button class="btn shield-btn" id="btn-sh-paper" onclick="toggleShield('paper')" data-i18n="paper">Papier</button>
                <button class="btn shield-btn" id="btn-sh-aluminum" onclick="toggleShield('aluminum')" data-i18n="aluminum">Aluminium</button>
                <button class="btn shield-btn" id="btn-sh-lead" onclick="toggleShield('lead')" data-i18n="lead">Blei</button>
            </div>

            <button class="btn start-quiz-btn" onclick="startQuiz('ch2')" data-i18n="start_quiz">Quiz Starten</button>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div id="quiz-container">
        <div id="quiz-content"></div>
    </div>

    <!-- Scripts -->
    <script src="lib/three.min.js"></script>
    <script src="lib/OrbitControls.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/state.js"></script>
    <script src="js/quiz.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const select = document.querySelector('select');
            select.value = currentLang;
            updateTexts();
            updateUI();
            setSource('alpha'); // Init
        });

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111); // Dark room

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / (window.innerHeight - 60), 0.1, 1000);
        camera.position.set(0, 5, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight - 60);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 0.8);
        pointLight.position.set(-5, 5, 5);
        scene.add(pointLight);

        // --- Scene Objects ---

        // Radiation Source Box
        const sourceGeo = new THREE.BoxGeometry(2, 2, 2);
        const sourceMat = new THREE.MeshPhongMaterial({ color: 0x555555 });
        const sourceBox = new THREE.Mesh(sourceGeo, sourceMat);
        sourceBox.position.set(-8, 0, 0);
        scene.add(sourceBox);

        // Hole in box (visual only, draw a black circle)
        const holeGeo = new THREE.CircleGeometry(0.5, 32);
        const holeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const hole = new THREE.Mesh(holeGeo, holeMat);
        hole.position.set(-6.99, 0, 0);
        hole.rotation.y = Math.PI / 2;
        scene.add(hole);

        // Shields
        const shields = {
            paper: { active: false, mesh: null, pos: -3, color: 0xffffff, thickness: 0.1, stops: ['alpha'] },
            aluminum: { active: false, mesh: null, pos: 1, color: 0xbdc3c7, thickness: 0.3, stops: ['alpha', 'beta'] },
            lead: { active: false, mesh: null, pos: 5, color: 0x2c3e50, thickness: 1.0, stops: ['alpha', 'beta', 'gamma'] }
        };

        // Create Shield Meshes
        for (const [key, data] of Object.entries(shields)) {
            const geo = new THREE.BoxGeometry(data.thickness, 4, 4);
            const mat = new THREE.MeshPhongMaterial({ color: data.color, transparent: true, opacity: 0.8 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(data.pos, 10, 0); // Start hidden (high up)
            scene.add(mesh);
            data.mesh = mesh;
        }

        // Particle System for Radiation
        let currentSource = 'alpha';
        const particles = [];
        const particleColors = {
            alpha: 0xe74c3c, // Red (Heavy, slow)
            beta: 0x3498db,  // Blue (Light, fast)
            gamma: 0xf1c40f  // Yellow (Wave-like, very fast)
        };

        // To draw gamma waves
        const gammaWavePoints = [];

        function setSource(type) {
            currentSource = type;

            // UI Update
            document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-src-' + type).classList.add('active');

            const descBox = document.getElementById('desc-box');
            descBox.style.display = 'block';
            descBox.setAttribute('data-i18n', type + '_desc');
            descBox.innerText = t(type + '_desc');

            // Clear existing particles
            particles.forEach(p => scene.remove(p.mesh));
            particles.length = 0;
        }

        function toggleShield(type) {
            shields[type].active = !shields[type].active;
            const btn = document.getElementById('btn-sh-' + type);
            if (shields[type].active) {
                btn.classList.add('active');
                shields[type].mesh.position.y = 0; // Drop down
            } else {
                btn.classList.remove('active');
                shields[type].mesh.position.y = 10; // Move up
            }
        }

        function createParticle() {
            if (particles.length > 50) return; // Limit

            let geo, mat, mesh;

            if (currentSource === 'alpha') {
                // Alpha: Helium nucleus (clump of 4 spheres)
                geo = new THREE.SphereGeometry(0.3, 8, 8);
                mat = new THREE.MeshBasicMaterial({ color: particleColors.alpha });
                mesh = new THREE.Mesh(geo, mat);
            } else if (currentSource === 'beta') {
                // Beta: Fast electron (small sphere)
                geo = new THREE.SphereGeometry(0.1, 8, 8);
                mat = new THREE.MeshBasicMaterial({ color: particleColors.beta });
                mesh = new THREE.Mesh(geo, mat);
            } else {
                // Gamma: Photon (very small sphere acting as tracer)
                geo = new THREE.SphereGeometry(0.05, 8, 8);
                mat = new THREE.MeshBasicMaterial({ color: particleColors.gamma });
                mesh = new THREE.Mesh(geo, mat);
            }

            // Start at hole
            mesh.position.set(-7, (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5);
            scene.add(mesh);

            particles.push({
                mesh: mesh,
                speed: currentSource === 'alpha' ? 0.1 : (currentSource === 'beta' ? 0.2 : 0.4),
                type: currentSource,
                baseY: mesh.position.y,
                time: 0
            });
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / (window.innerHeight - 60);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight - 60);
        });

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Emit particles periodically
            if (Math.random() < 0.1) createParticle();

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.x += p.speed;
                p.time += 0.2;

                // Wavy motion for Gamma
                if (p.type === 'gamma') {
                    p.mesh.position.y = p.baseY + Math.sin(p.time) * 0.5;
                }

                // Check collision with shields
                let stopped = false;
                for (const [key, sData] of Object.entries(shields)) {
                    if (sData.active && sData.stops.includes(p.type)) {
                        // Check if particle passed shield front face
                        if (p.mesh.position.x > sData.pos - (sData.thickness/2) && p.mesh.position.x < sData.pos) {
                            stopped = true;
                            break;
                        }
                    }
                }

                // Remove if stopped or off screen (e.g., hit far right wall)
                if (stopped || p.mesh.position.x > 10) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
