<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: Elektromagnetische Wellen</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #container {
            flex-grow: 1;
            width: 100%;
            cursor: move;
        }

        .ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            gap: 30px;
            z-index: 10;
            border: 1px solid #333;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }

        input[type=range] {
            width: 150px;
            cursor: pointer;
        }

        .legend {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.8);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #444;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .color-box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        h1 {
            position: absolute;
            top: 20px;
            right: 20px;
            margin: 0;
            font-size: 18px;
            font-weight: 300;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>Entstehung EM-Wellen</h1>

    <div class="legend">
        <div class="legend-item">
            <div class="color-box" style="background: #ff4757;"></div>
            <span>Elektrisches Feld (E)</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background: #2e86de;"></div>
            <span>Magnetisches Feld (B)</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background: #f1c40f;"></div>
            <span>Oszillierende Ladung</span>
        </div>
    </div>

    <div id="container"></div>

    <div class="ui-overlay">
        <div class="control-group">
            <label for="freq">Frequenz</label>
            <input type="range" id="freq" min="0.5" max="5" step="0.1" value="2">
        </div>
        <div class="control-group">
            <label for="amp">Amplitude</label>
            <input type="range" id="amp" min="0.5" max="4" step="0.1" value="2">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Setup
        const container = document.getElementById('container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 10, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Beleuchtung
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // Grid & Achsen
        const gridHelper = new THREE.GridHelper(40, 40, 0x333333, 0x222222);
        scene.add(gridHelper);

        // Ladung (Dipol Zentrum)
        const chargeGeom = new THREE.SphereGeometry(0.5, 32, 32);
        const chargeMat = new THREE.MeshPhongMaterial({ color: 0xf1c40f, emissive: 0xf1c40f, emissiveIntensity: 0.5 });
        const charge = new THREE.Mesh(chargeGeom, chargeMat);
        scene.add(charge);

        // Wellen-Parameter
        let frequency = 2;
        let amplitude = 2;
        const numPoints = 60;
        const spacing = 0.5;

        // UI Listener
        document.getElementById('freq').addEventListener('input', (e) => frequency = parseFloat(e.target.value));
        document.getElementById('amp').addEventListener('input', (e) => amplitude = parseFloat(e.target.value));

        // Pfeile erstellen
        const eVectors = [];
        const bVectors = [];

        function createArrow(color) {
            const group = new THREE.Group();
            const stemGeom = new THREE.CylinderGeometry(0.05, 0.05, 1, 8);
            const stem = new THREE.Mesh(stemGeom, new THREE.MeshBasicMaterial({ color: color }));
            stem.position.y = 0.5;
            group.add(stem);
            
            const headGeom = new THREE.ConeGeometry(0.15, 0.3, 8);
            const head = new THREE.Mesh(headGeom, new THREE.MeshBasicMaterial({ color: color }));
            head.position.y = 1;
            group.add(head);
            
            return group;
        }

        for (let i = 0; i < numPoints; i++) {
            const eArrow = createArrow(0xff4757);
            const bArrow = createArrow(0x2e86de);
            
            eArrow.position.x = i * spacing;
            bArrow.position.x = i * spacing;
            
            // B-Feld um 90 Grad drehen (X-Z Ebene)
            bArrow.rotation.x = Math.PI / 2;
            
            scene.add(eArrow);
            scene.add(bArrow);
            
            eVectors.push(eArrow);
            bVectors.push(bArrow);
        }

        // Animation
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.02 * frequency;

            // Ladung oszilliert auf Y-Achse
            const chargeY = Math.sin(time * 5) * amplitude;
            charge.position.y = chargeY;

            // Wellen-Vektoren aktualisieren
            for (let i = 0; i < numPoints; i++) {
                const x = i * spacing;
                // Wellengleichung: y = A * sin(kx - wt)
                // k = 1 (Wellenzahl), w = frequency
                const phase = x * 0.8 - time * 5;
                const val = Math.sin(phase) * amplitude;

                // E-Feld (Y-Richtung)
                eVectors[i].scale.y = val || 0.001; 
                if (val < 0) {
                    eVectors[i].rotation.z = Math.PI;
                } else {
                    eVectors[i].rotation.z = 0;
                }

                // B-Feld (Z-Richtung)
                bVectors[i].scale.y = val || 0.001;
                if (val < 0) {
                    bVectors[i].rotation.y = Math.PI;
                } else {
                    bVectors[i].rotation.y = 0;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
