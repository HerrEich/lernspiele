name: FTP Deploy

on:
  push:
    branches:
      - main # Der Workflow startet, sobald du etwas in den "main" Branch pushst

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
        - name: 📂 Sync files
          uses: SamKirkland/FTP-Deploy-Action@v4.3.5
          with:
            server: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            protocol: ftp
            port: 21
            concurrency: 1
            timeout: 600000
            log-level: standard
