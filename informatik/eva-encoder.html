<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA-Prinzip Simulator: Der Geheimcode-Übersetzer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #1e3a8a;
            margin: 0 0 10px 0;
        }

        .subtitle {
            font-size: 1.2em;
            color: #4b5563;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .eva-container {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        @media (max-width: 950px) {
            .eva-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            position: relative;
            border-top: 8px solid;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card-e {
            border-top-color: #3b82f6; /* Blau für Eingabe */
        }

        .card-v {
            border-top-color: #4b5563; /* Grau für Verarbeitung */
            background-color: #1f2937;
            color: #f9fafb;
        }

        .card-a {
            border-top-color: #10b981; /* Grün für Ausgabe */
        }

        h2 {
            margin-top: 0;
            font-size: 1.4em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-e h2 { color: #2563eb; }
        .card-v h2 { color: #f3f4f6; }
        .card-a h2 { color: #059669; }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95em;
        }

        .card-e label { color: #4b5563; }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            font-size: 1.1em;
            box-sizing: border-box;
            text-transform: uppercase;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            flex-grow: 1;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Verarbeitung-Terminal */
        .terminal {
            background-color: #111827;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            height: 250px;
            overflow-y: auto;
            border: 1px solid #374151;
            font-size: 0.9em;
            line-height: 1.5;
            color: #34d399; /* Terminal-Grün */
        }

        .terminal-line {
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(5px);
            animation: fadeInUp 0.3s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cpu-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            gap: 15px;
        }

        .gear {
            width: 45px;
            height: 45px;
            fill: #9ca3af;
        }

        .gear.spinning {
            animation: spin 2.5s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Ausgabe-Sektion */
        .output-box {
            background-color: #ecfdf5;
            border: 2px dashed #34d399;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 15px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .output-text {
            font-size: 2.5em;
            font-weight: bold;
            color: #065f46;
            letter-spacing: 3px;
            word-break: break-all;
            margin: 0;
        }

        .placeholder-text {
            color: #6b7280;
            font-style: italic;
        }

        .reset-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.95em;
            cursor: pointer;
            margin-top: auto;
            transition: background-color 0.2s;
            align-self: center;
        }

        .reset-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <header>
        <h1>EVA-Prinzip Simulator</h1>
        <div class="subtitle">Eingabe (E) ➔ Verarbeitung (V) ➔ Ausgabe (A)</div>
    </header>

    <div class="eva-container">
        
        <!-- EINGABE -->
        <div class="card card-e">
            <h2>
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H9v-2h6v2zm3-4H6V8h12v6z"/></svg>
                1. Eingabe (E)
            </h2>
            <div class="form-group">
                <label for="inputText">Wort eingeben (nur Buchstaben):</label>
                <input type="text" id="inputText" placeholder="Z. B. INFORMATIK" maxlength="12">
            </div>
            <div class="form-group">
                <label for="shift">Geheimer Schlüssel (Verschiebung): +<span id="shiftValue">3</span></label>
                <div class="slider-container">
                    <span>1</span>
                    <input type="range" id="shift" min="1" max="10" value="3">
                    <span>10</span>
                </div>
            </div>
            <div class="form-group">
                <label for="speed">Verarbeitungs-Tempo:</label>
                <select id="speed" style="width: 100%; padding: 10px; border-radius: 8px; border: 2px solid #d1d5db; background: white; font-size: 0.95em;">
                    <option value="1600" selected>Langsam</option>
                    <option value="800">Mittel</option>
                    <option value="300">Schnell</option>
                </select>
            </div>
            <button class="btn" id="startBtn">Daten abschicken (➔ V)</button>
        </div>

        <!-- VERARBEITUNG -->
        <div class="card card-v">
            <h2>
                <svg class="gear" id="cpuGear" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                2. Verarbeitung (V)
            </h2>
            <div class="cpu-container">
                <span id="statusText" style="font-weight: bold; font-size: 1.1em;">Bereit...</span>
            </div>
            <div class="terminal" id="terminalLog">
                <div style="color: #6b7280;">[System im Standby] Warte auf Eingabedaten...</div>
            </div>
        </div>

        <!-- AUSGABE -->
        <div class="card card-a">
            <h2>
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
                3. Ausgabe (A)
            </h2>
            <p style="margin: 0 0 10px 0; font-size: 0.9em; color: #4b5563;">Das berechnete Geheimwort auf dem Monitor:</p>
            <div class="output-box" id="outputBox">
                <span class="placeholder-text" id="outputPlaceholder">Noch keine Daten empfangen...</span>
                <p class="output-text" id="outputText" style="display: none;"></p>
            </div>
            <button class="reset-btn" id="resetBtn">System löschen</button>
        </div>

    </div>

    <script>
        const inputText = document.getElementById('inputText');
        const shiftInput = document.getElementById('shift');
        const shiftValue = document.getElementById('shiftValue');
        const speedSelect = document.getElementById('speed');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const terminalLog = document.getElementById('terminalLog');
        const statusText = document.getElementById('statusText');
        const outputBox = document.getElementById('outputBox');
        const outputPlaceholder = document.getElementById('outputPlaceholder');
        const outputText = document.getElementById('outputText');
        const cpuGear = document.getElementById('cpuGear');

        shiftInput.addEventListener('input', () => {
            shiftValue.textContent = shiftInput.value;
        });

        // Web Audio API für Sound-Effekte (ohne externe MP3s)
        let audioCtx = null;
        function playTone(freq, duration, type = 'sine') {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log('Audio Blocked');
            }
        }

        function clearTerminal() {
            terminalLog.innerHTML = '';
        }

        function addLogLine(text, isHeader = false) {
            const line = document.createElement('div');
            line.className = 'terminal-line';
            if (isHeader) {
                line.style.color = '#3b82f6';
                line.style.fontWeight = 'bold';
                line.style.marginTop = '10px';
            }
            line.innerHTML = `&gt; ${text}`;
            terminalLog.appendChild(line);
            terminalLog.scrollTop = terminalLog.scrollHeight;
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function startProcessing() {
            let word = inputText.value.trim().toUpperCase();
            
            // Eingabe-Validierung
            word = word.replace(/[^A-ZÄÖÜß]/g, ""); 
            if (!word) {
                alert('Bitte gib zuerst ein Wort (nur Buchstaben) im Eingabebereich ein!');
                return;
            }

            // Steuerelemente sperren
            inputText.disabled = true;
            shiftInput.disabled = true;
            startBtn.disabled = true;
            speedSelect.disabled = true;

            const shift = parseInt(shiftInput.value);
            const ms = parseInt(speedSelect.value);

            // Terminal und Ausgabe vorbereiten
            clearTerminal();
            outputText.style.display = 'none';
            outputPlaceholder.style.display = 'block';
            outputPlaceholder.textContent = 'Verarbeite Daten...';
            outputBox.style.backgroundColor = '#ecfdf5';

            // Animation starten
            cpuGear.classList.add('spinning');
            statusText.textContent = 'Berechne...';
            statusText.style.color = '#f59e0b';

            // --- SCHRITT 1: EINGABE ---
            addLogLine(`SCHRITT 1: Eingabe erhalten!`, true);
            playTone(400, 0.1);
            await delay(ms);
            addLogLine(`Lese das Wort ein: "${word}"`);
            await delay(ms);

            // --- SCHRITT 2: ZERLEGUNG ---
            addLogLine(`SCHRITT 2: Wort in Buchstaben zerlegen.`, true);
            playTone(480, 0.1);
            await delay(ms);
            const chars = word.split('');
            addLogLine(`Einzelteile: [${chars.join(', ')}]`);
            await delay(ms);

            // --- SCHRITT 3 & 4: VERARBEITUNG / BERECHNUNG ---
            addLogLine(`SCHRITT 3 & 4: Verschiebe jeden Buchstaben (+${shift}).`, true);
            await delay(ms);

            let resultChars = [];
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

            for (let i = 0; i < chars.length; i++) {
                const char = chars[i];
                const index = alphabet.indexOf(char);

                if (index !== -1) {
                    const originalPos = index + 1; // A=1, B=2 ...
                    let newPos = originalPos + shift;
                    if (newPos > 26) {
                        newPos = newPos - 26; // Überlauf am Alphabet-Ende
                    }
                    const newChar = alphabet[newPos - 1];
                    resultChars.push(newChar);

                    addLogLine(`Buchstabe ${i+1}: "${char}" (Stelle ${originalPos}) ➔ +${shift} ➔ Stelle ${newPos} ("${newChar}")`);
                    playTone(550 + (i * 40), 0.15);
                } else {
                    // Sonderzeichen / Umlaute unverändert lassen
                    resultChars.push(char);
                    addLogLine(`Buchstabe ${i+1}: "${char}" wird nicht verschoben.`);
                    playTone(300, 0.15);
                }
                await delay(ms);
            }

            // --- SCHRITT 5: ZUSAMMENBAU ---
            addLogLine(`SCHRITT 5: Geheimwort neu zusammensetzen.`, true);
            playTone(650, 0.15);
            await delay(ms);
            const encryptedWord = resultChars.join('');
            addLogLine(`Ergebnis fertig: "${encryptedWord}"`);
            await delay(ms);

            // --- SCHRITT 6: AUSGABE ---
            addLogLine(`SCHRITT 6: Sende Signal an Ausgabegerät...`, true);
            playTone(750, 0.1);
            await delay(ms);

            // Animation stoppen
            cpuGear.classList.remove('spinning');
            statusText.textContent = 'Fertig!';
            statusText.style.color = '#10b981';

            // Ausgabe anzeigen
            outputPlaceholder.style.display = 'none';
            outputText.textContent = encryptedWord;
            outputText.style.display = 'block';
            outputBox.style.backgroundColor = '#d1fae5'; // Erfolg-Grün

            // Erfolgs-Chime
            playTone(523.25, 0.08, 'triangle'); // C5
            setTimeout(() => playTone(659.25, 0.08, 'triangle'), 80); // E5
            setTimeout(() => playTone(783.99, 0.25, 'triangle'), 160); // G5

            startBtn.disabled = false;
        }

        function resetAll() {
            inputText.disabled = false;
            shiftInput.disabled = false;
            startBtn.disabled = false;
            speedSelect.disabled = false;
            
            inputText.value = '';
            shiftInput.value = 3;
            shiftValue.textContent = '3';
            
            cpuGear.classList.remove('spinning');
            statusText.textContent = 'Bereit...';
            statusText.style.color = '#4b5563';

            clearTerminal();
            terminalLog.innerHTML = '<div style="color: #6b7280;">[System im Standby] Warte auf Eingabedaten...</div>';

            outputText.style.display = 'none';
            outputPlaceholder.style.display = 'block';
            outputPlaceholder.textContent = 'Warte auf neue Daten...';
            outputBox.style.backgroundColor = '#ecfdf5';
        }

        startBtn.addEventListener('click', startProcessing);
        resetBtn.addEventListener('click', resetAll);
    </script>
</body>
</html>
