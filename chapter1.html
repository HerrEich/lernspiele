<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="ch1_title">1. Atombau & Isotope</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="chapter-container">
        <header>
            <div>
                <a href="index.html" class="btn back-btn" data-i18n="back_to_menu">Zurück zum Menü</a>
                <span data-i18n="ch1_title">1. Atombau & Isotope</span>
            </div>
            <div class="language-selector">
                <select onchange="setLanguage(this.value)">
                    <option value="de">Deutsch</option>
                    <option value="en">English</option>
                    <option value="uk">Українська</option>
                </select>
            </div>
            <div class="points-display">
                <span data-i18n="points">Punkte:</span> <span id="points-display">0</span>
            </div>
        </header>

        <div class="scene-container" id="canvas-container">
            <!-- UI Overlay Left -->
            <div class="ui-overlay">
                <p data-i18n="ch1_instruction">Baue ein Atom! Klicke auf die Buttons...</p>

                <div class="control-group">
                    <span data-i18n="protons">Protonen</span>
                    <div>
                        <button class="btn" onclick="modifyNucleon('proton', -1)">-</button>
                        <span id="p-count" style="margin:0 10px; font-weight:bold;">1</span>
                        <button class="btn" onclick="modifyNucleon('proton', 1)">+</button>
                    </div>
                </div>

                <div class="control-group">
                    <span data-i18n="neutrons">Neutronen</span>
                    <div>
                        <button class="btn" onclick="modifyNucleon('neutron', -1)">-</button>
                        <span id="n-count" style="margin:0 10px; font-weight:bold;">0</span>
                        <button class="btn" onclick="modifyNucleon('neutron', 1)">+</button>
                    </div>
                </div>

            </div>

            <!-- UI Overlay Right -->
            <div class="ui-overlay-right">
                <div>
                    <strong data-i18n="element">Element:</strong> <span id="element-name">Wasserstoff</span>
                </div>
                <div style="margin-top: 10px;">
                    <strong data-i18n="isotope">Isotop:</strong> <span id="isotope-name">H-1</span>
                </div>
                <div id="stability-badge" class="status-badge status-stable" data-i18n="stable">Stabil</div>
            </div>

            <button class="btn start-quiz-btn" onclick="startQuiz('ch1')" data-i18n="start_quiz">Quiz Starten</button>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div id="quiz-container">
        <div id="quiz-content"></div>
    </div>

    <!-- Scripts -->
    <script src="lib/three.min.js"></script>
    <script src="lib/OrbitControls.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/state.js"></script>
    <script src="js/quiz.js"></script>

    <script>
        // Set dropdown language
        document.addEventListener('DOMContentLoaded', () => {
            const select = document.querySelector('select');
            select.value = currentLang;
            updateTexts();
            updateUI(); // From state.js
        });

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // Background slightly dark blue/grey
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / (window.innerHeight - 60), 0.1, 1000);
        camera.position.set(0, 0, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        // Adjust size considering header
        renderer.setSize(window.innerWidth, window.innerHeight - 60);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 0.8);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // --- Atom Logic & Visualization ---
        let protons = 1;
        let neutrons = 0;
        const maxNucleons = 20;

        const nucleusGroup = new THREE.Group();
        scene.add(nucleusGroup);

        const electronGroup = new THREE.Group();
        scene.add(electronGroup);

        // Materials
        const protonMat = new THREE.MeshPhongMaterial({ color: 0xe74c3c, shininess: 100 }); // Red
        const neutronMat = new THREE.MeshPhongMaterial({ color: 0x3498db, shininess: 100 }); // Blue
        const electronMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f }); // Yellow
        const orbitMat = new THREE.LineBasicMaterial({ color: 0x7f8c8d, transparent: true, opacity: 0.5 });

        // Simple Isotope Data (Atomic Number Z : [Stable Neutrons])
        // Simplified for 10th grade
        const elementsData = {
            1: { name: { de: "Wasserstoff (H)", en: "Hydrogen (H)", uk: "Водень (H)" }, stableN: [0, 1] },
            2: { name: { de: "Helium (He)", en: "Helium (He)", uk: "Гелій (He)" }, stableN: [1, 2] },
            3: { name: { de: "Lithium (Li)", en: "Lithium (Li)", uk: "Літій (Li)" }, stableN: [3, 4] },
            4: { name: { de: "Beryllium (Be)", en: "Beryllium (Be)", uk: "Берилій (Be)" }, stableN: [5] },
            5: { name: { de: "Bor (B)", en: "Boron (B)", uk: "Бор (B)" }, stableN: [5, 6] },
            6: { name: { de: "Kohlenstoff (C)", en: "Carbon (C)", uk: "Вуглець (C)" }, stableN: [6, 7] }, // C-14 (N=8) is unstable
            7: { name: { de: "Stickstoff (N)", en: "Nitrogen (N)", uk: "Азот (N)" }, stableN: [7, 8] },
            8: { name: { de: "Sauerstoff (O)", en: "Oxygen (O)", uk: "Кисень (O)" }, stableN: [8, 9, 10] },
            // Fallback for > 8
            fallback: { name: { de: "Schweres Element", en: "Heavy Element", uk: "Важкий елемент" } }
        };

        function modifyNucleon(type, amount) {
            if (type === 'proton') {
                protons += amount;
                if (protons < 1) protons = 1;
                if (protons > 8) protons = 8; // Limit to Oxygen for simplicity
            } else if (type === 'neutron') {
                neutrons += amount;
                if (neutrons < 0) neutrons = 0;
                if (neutrons > 12) neutrons = 12; // Limit
            }

            document.getElementById('p-count').innerText = protons;
            document.getElementById('n-count').innerText = neutrons;

            updateAtomVisuals();
            updateAtomInfo();
        }

        function updateAtomInfo() {
            const elData = elementsData[protons] || elementsData.fallback;
            const elName = elData.name[currentLang] || elData.name.de;

            document.getElementById('element-name').innerText = elName;

            // Symbol extraction (e.g. "Carbon (C)" -> "C")
            const symbolMatch = elName.match(/\(([^)]+)\)/);
            const symbol = symbolMatch ? symbolMatch[1] : "X";
            const massNumber = protons + neutrons;

            document.getElementById('isotope-name').innerText = `${symbol}-${massNumber}`;

            // Check stability
            const badge = document.getElementById('stability-badge');
            let isStable = false;

            if (elData.stableN && elData.stableN.includes(neutrons)) {
                isStable = true;
            }

            if (isStable) {
                badge.className = 'status-badge status-stable';
                badge.setAttribute('data-i18n', 'stable');
                badge.innerText = t('stable');
                nucleusGroup.position.set(0,0,0); // reset vibration
            } else {
                badge.className = 'status-badge status-unstable';
                badge.setAttribute('data-i18n', 'unstable');
                badge.innerText = t('unstable');
                // Vibration is handled in animation loop
            }
        }

        function updateAtomVisuals() {
            // Clear current
            while(nucleusGroup.children.length > 0){
                nucleusGroup.remove(nucleusGroup.children[0]);
            }
            while(electronGroup.children.length > 0){
                electronGroup.remove(electronGroup.children[0]);
            }

            const nucleonGeometry = new THREE.SphereGeometry(0.5, 32, 32);

            // Simple algorithm to pack spheres roughly in a clump
            let pPlaced = 0;
            let nPlaced = 0;
            const total = protons + neutrons;

            for (let i = 0; i < total; i++) {
                let isProton = false;
                if (pPlaced < protons && nPlaced < neutrons) {
                    isProton = Math.random() > 0.5;
                } else if (pPlaced < protons) {
                    isProton = true;
                }

                const mesh = new THREE.Mesh(nucleonGeometry, isProton ? protonMat : neutronMat);

                // Archimedean spiral-ish packing for simplicity
                const radius = 0.4 * Math.pow(i, 0.5);
                const theta = i * 2.39996; // golden angle
                const phi = Math.acos(1 - 2 * (i + 0.5) / total);

                mesh.position.set(
                    radius * Math.sin(phi) * Math.cos(theta),
                    radius * Math.sin(phi) * Math.sin(theta),
                    radius * Math.cos(phi)
                );

                // Jitter for organic look
                mesh.position.x += (Math.random() - 0.5) * 0.2;
                mesh.position.y += (Math.random() - 0.5) * 0.2;
                mesh.position.z += (Math.random() - 0.5) * 0.2;

                nucleusGroup.add(mesh);

                if (isProton) pPlaced++; else nPlaced++;
            }

            // Electrons (Bohr model rings for simplicity)
            const electronGeometry = new THREE.SphereGeometry(0.2, 16, 16);

            // Shell 1 (max 2), Shell 2 (max 8)
            let e1 = Math.min(2, protons);
            let e2 = Math.max(0, protons - 2);

            drawElectronShell(1, e1, 3.0, electronGeometry);
            if(e2 > 0) drawElectronShell(2, e2, 5.0, electronGeometry);
        }

        function drawElectronShell(shellNum, eCount, radius, geo) {
            // Draw Orbit
            const orbitGeo = new THREE.RingGeometry(radius - 0.02, radius + 0.02, 64);
            const orbit = new THREE.Mesh(orbitGeo, new THREE.MeshBasicMaterial({ color: 0x7f8c8d, side: THREE.DoubleSide, transparent: true, opacity: 0.3 }));

            // Random tilt for orbits to look 3D
            orbit.rotation.x = Math.random() * Math.PI;
            orbit.rotation.y = Math.random() * Math.PI;
            electronGroup.add(orbit);

            // Add Electrons
            for (let i = 0; i < eCount; i++) {
                const electron = new THREE.Mesh(geo, electronMat);
                const angle = (i / eCount) * Math.PI * 2;

                // Create a pivot for rotation
                const pivot = new THREE.Group();
                pivot.rotation.copy(orbit.rotation);

                electron.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, 0);

                // Store data for animation
                pivot.userData = { speed: 0.02 / shellNum };

                pivot.add(electron);
                electronGroup.add(pivot);
            }
        }

        // Handle window resize
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / (window.innerHeight - 60);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight - 60);
        }

        // Initial Build
        updateAtomVisuals();
        updateAtomInfo();

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Rotate electrons
            electronGroup.children.forEach(child => {
                if(child.type === 'Group') { // It's an electron pivot
                    child.rotation.z += child.userData.speed;
                }
            });

            // Vibrate nucleus if unstable
            const badge = document.getElementById('stability-badge');
            if (badge && badge.className.includes('status-unstable')) {
                nucleusGroup.position.x = (Math.random() - 0.5) * 0.1;
                nucleusGroup.position.y = (Math.random() - 0.5) * 0.1;
            }

            renderer.render(scene, camera);
        }
        animate();

        // Add translation for the extra button manually to handle updates smoothly
        translations.de.start_quiz = "Quiz Starten";
        translations.en.start_quiz = "Start Quiz";
        translations.uk.start_quiz = "Почати вікторину";
    </script>
</body>
</html>
