<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="ch3_title">3. Halbwertszeit</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        #chart-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 300px;
            height: 200px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        canvas#decay-chart {
            width: 100%;
            height: 100%;
        }
        .stats {
            margin-top: 15px;
            font-size: 1.1em;
            font-weight: bold;
        }
        .stats span { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="chapter-container">
        <header>
            <div>
                <a href="index.html" class="btn back-btn" data-i18n="back_to_menu">Zurück zum Menü</a>
                <span data-i18n="ch3_title">3. Halbwertszeit</span>
            </div>
            <div class="language-selector">
                <select onchange="setLanguage(this.value)">
                    <option value="de">Deutsch</option>
                    <option value="en">English</option>
                    <option value="uk">Українська</option>
                </select>
            </div>
            <div class="points-display">
                <span data-i18n="points">Punkte:</span> <span id="points-display">0</span>
            </div>
        </header>

        <div class="scene-container" id="canvas-container">
            <!-- UI Overlay Left -->
            <div class="ui-overlay">
                <p data-i18n="ch3_instruction">Hier siehst du radioaktive Atome. Klicke auf 'Start', um die Zeit vergehen zu lassen.</p>

                <button class="btn" id="btn-start-decay" onclick="startDecay()" style="width:100%; font-size:1.2em; margin-bottom:10px;" data-i18n="start_decay">Zerfall starten</button>
                <button class="btn" onclick="resetDecay()" style="width:100%; background-color:#7f8c8d;" data-i18n="reset">Reset</button>

                <div class="stats">
                    <div data-i18n="time">Zeit:</div> <span id="time-display">0</span> s<br>
                    <div data-i18n="remaining">Übrige Atome:</div> <span id="atoms-display">100</span><br>
                    <div data-i18n="halflife">Halbwertszeit:</div> <span>5 s</span>
                </div>

                <p data-i18n="curve_desc" style="font-size: 0.8em; margin-top:15px; color:#555;">Die Halbwertszeit ist die Zeit, in der genau die Hälfte der Atome zerfallen ist.</p>
            </div>

            <!-- Chart Overlay Right Bottom -->
            <div id="chart-container">
                <canvas id="decay-chart"></canvas>
            </div>

            <button class="btn start-quiz-btn" onclick="startQuiz('ch3')" data-i18n="start_quiz" style="bottom: 240px;">Quiz Starten</button>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div id="quiz-container">
        <div id="quiz-content"></div>
    </div>

    <!-- Scripts -->
    <script src="lib/three.min.js"></script>
    <script src="lib/OrbitControls.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/state.js"></script>
    <script src="js/quiz.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const select = document.querySelector('select');
            select.value = currentLang;
            updateTexts();
            updateUI();
            initChart();
        });

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a); // Very dark blue

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / (window.innerHeight - 60), 0.1, 1000);
        camera.position.set(0, 0, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight - 60);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        // --- Atom Grid ---
        const totalAtoms = 100;
        const atoms = [];
        const activeMat = new THREE.MeshPhongMaterial({ color: 0xe74c3c }); // Red (active)
        const decayedMat = new THREE.MeshPhongMaterial({ color: 0x34495e }); // Dark grey (decayed)
        const geo = new THREE.SphereGeometry(0.4, 16, 16);
        const atomGroup = new THREE.Group();
        scene.add(atomGroup);

        function createGrid() {
            // Clear existing
            while(atomGroup.children.length > 0) atomGroup.remove(atomGroup.children[0]);
            atoms.length = 0;

            const cols = 10;
            const rows = 10;
            const spacing = 1.5;

            const offsetX = -(cols * spacing) / 2 + (spacing/2);
            const offsetY = -(rows * spacing) / 2 + (spacing/2);

            for (let i = 0; i < totalAtoms; i++) {
                const mesh = new THREE.Mesh(geo, activeMat);
                const x = (i % cols) * spacing + offsetX;
                const y = Math.floor(i / cols) * spacing + offsetY;

                // Add slight jitter for organic look
                mesh.position.set(
                    x + (Math.random()-0.5)*0.3,
                    y + (Math.random()-0.5)*0.3,
                    (Math.random()-0.5)*0.3
                );

                atomGroup.add(mesh);
                atoms.push({
                    mesh: mesh,
                    decayed: false
                });
            }
        }
        createGrid();

        // --- Simulation Logic ---
        let simActive = false;
        let simTime = 0;
        let lastTime = 0;
        const halfLife = 5; // seconds

        // Decay constant lambda = ln(2) / t_1/2
        const lambda = Math.log(2) / halfLife;

        function startDecay() {
            if (simActive) return;
            simActive = true;
            lastTime = performance.now();
            document.getElementById('btn-start-decay').disabled = true;
        }

        function resetDecay() {
            simActive = false;
            simTime = 0;
            createGrid();
            document.getElementById('time-display').innerText = 0;
            document.getElementById('atoms-display').innerText = totalAtoms;
            document.getElementById('btn-start-decay').disabled = false;

            // Reset Chart
            chartData = [{x: 0, y: totalAtoms}];
            drawChart();
        }

        function processDecay(dt) {
            let activeCount = 0;
            atoms.forEach(atom => {
                if (!atom.decayed) {
                    // Probability of decay in time dt: P = 1 - e^(-lambda * dt)
                    const prob = 1 - Math.exp(-lambda * dt);
                    if (Math.random() < prob) {
                        atom.decayed = true;
                        atom.mesh.material = decayedMat;
                        // Small "pop" animation by scaling quickly
                        atom.mesh.scale.set(1.5,1.5,1.5);
                    } else {
                        activeCount++;
                    }
                }

                // Animate scale back to normal if popped
                if(atom.mesh.scale.x > 1.0) {
                    atom.mesh.scale.subScalar(0.05);
                }
            });

            document.getElementById('atoms-display').innerText = activeCount;
            return activeCount;
        }

        // --- Simple Chart Logic (No external libs to keep it simple) ---
        const canvas = document.getElementById('decay-chart');
        const ctx = canvas.getContext('2d');
        let chartData = [{x: 0, y: totalAtoms}];
        let lastChartUpdate = 0;

        function initChart() {
            // High DPI canvas fixing
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            ctx.scale(2,2);
            drawChart();
        }

        function drawChart() {
            const w = canvas.width / 2;
            const h = canvas.height / 2;

            ctx.clearRect(0, 0, w, h);

            // Axes
            ctx.beginPath();
            ctx.moveTo(30, 10);
            ctx.lineTo(30, h - 20);
            ctx.lineTo(w - 10, h - 20);
            ctx.strokeStyle = "#333";
            ctx.stroke();

            // Plot Data
            if (chartData.length > 0) {
                ctx.beginPath();
                const maxTime = Math.max(20, simTime); // Show at least 20s

                chartData.forEach((pt, i) => {
                    const x = 30 + (pt.x / maxTime) * (w - 40);
                    const y = (h - 20) - (pt.y / totalAtoms) * (h - 30);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });

                ctx.strokeStyle = "#e74c3c";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw half-life markers
                ctx.setLineDash([5, 5]);
                ctx.strokeStyle = "#7f8c8d";
                ctx.lineWidth = 1;

                for(let hl=1; hl<=Math.floor(maxTime/halfLife); hl++) {
                    const t = hl * halfLife;
                    const x = 30 + (t / maxTime) * (w - 40);
                    const targetY = (h - 20) - ((totalAtoms / Math.pow(2, hl)) / totalAtoms) * (h - 30);

                    ctx.beginPath();
                    ctx.moveTo(x, h - 20);
                    ctx.lineTo(x, targetY);
                    ctx.lineTo(30, targetY);
                    ctx.stroke();
                }
                ctx.setLineDash([]);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / (window.innerHeight - 60);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight - 60);
            initChart(); // Re-init chart size
        });

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (simActive) {
                const now = performance.now();
                const dt = (now - lastTime) / 1000; // in seconds
                lastTime = now;
                simTime += dt;

                document.getElementById('time-display').innerText = simTime.toFixed(1);

                const currentActive = processDecay(dt);

                // Update chart 2 times a second
                if (now - lastChartUpdate > 500) {
                    chartData.push({x: simTime, y: currentActive});
                    drawChart();
                    lastChartUpdate = now;
                }

                // Auto stop
                if (currentActive === 0 && simTime > 1) {
                    simActive = false;
                    chartData.push({x: simTime, y: 0});
                    drawChart();
                }
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
