<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="ch4_title">4. Kernspaltung</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .reactor-controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .temp-bar-container {
            width: 100%;
            height: 20px;
            background: #bdc3c7;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        #temp-bar {
            height: 100%;
            width: 50%;
            background: #f1c40f;
            transition: width 0.2s, background-color 0.2s;
        }
    </style>
</head>
<body>
    <div class="chapter-container">
        <header>
            <div>
                <a href="index.html" class="btn back-btn" data-i18n="back_to_menu">Zurück zum Menü</a>
                <span data-i18n="ch4_title">4. Kernspaltung</span>
            </div>
            <div class="language-selector">
                <select onchange="setLanguage(this.value)">
                    <option value="de">Deutsch</option>
                    <option value="en">English</option>
                    <option value="uk">Українська</option>
                </select>
            </div>
            <div class="points-display">
                <span data-i18n="points">Punkte:</span> <span id="points-display">0</span>
            </div>
        </header>

        <div class="scene-container" id="canvas-container">
            <!-- UI Overlay Left -->
            <div class="ui-overlay">
                <p data-i18n="ch4_instruction">Bewege die Steuerstäbe in den Reaktor, um die Kettenreaktion zu kontrollieren!</p>

                <div class="reactor-controls">
                    <button class="btn" onmousedown="moveRods(-1)" onmouseup="stopRods()" onmouseleave="stopRods()" ontouchstart="moveRods(-1)" ontouchend="stopRods()" data-i18n="rods_in">Stäbe rein (Kühlen)</button>
                    <button class="btn" style="background-color: #e74c3c;" onmousedown="moveRods(1)" onmouseup="stopRods()" onmouseleave="stopRods()" ontouchstart="moveRods(1)" ontouchend="stopRods()" data-i18n="rods_out">Stäbe raus (Erhitzen)</button>
                </div>

                <div style="margin-top: 20px;">
                    <strong data-i18n="temperature">Temperatur:</strong>
                    <div class="temp-bar-container">
                        <div id="temp-bar"></div>
                    </div>
                    <div id="reactor-status" style="margin-top: 5px; font-weight: bold; text-align: center;">-</div>
                </div>
            </div>

            <button class="btn start-quiz-btn" onclick="startQuiz('ch4')" data-i18n="start_quiz">Quiz Starten</button>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div id="quiz-container">
        <div id="quiz-content"></div>
    </div>

    <!-- Scripts -->
    <script src="lib/three.min.js"></script>
    <script src="lib/OrbitControls.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/state.js"></script>
    <script src="js/quiz.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const select = document.querySelector('select');
            select.value = currentLang;
            updateTexts();
            updateUI();
        });

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2c3e50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / (window.innerHeight - 60), 0.1, 1000);
        camera.position.set(0, 10, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight - 60);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Restrict camera so user doesn't get lost
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.minDistance = 10;
        controls.maxDistance = 40;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const coreLight = new THREE.PointLight(0x3498db, 1, 50); // Cherenkov radiation blue
        coreLight.position.set(0, 0, 0);
        scene.add(coreLight);

        // --- Reactor Core Model ---
        const coreGroup = new THREE.Group();
        scene.add(coreGroup);

        // Water basin
        const basinGeo = new THREE.CylinderGeometry(8, 8, 10, 32);
        const basinMat = new THREE.MeshPhysicalMaterial({
            color: 0x2980b9,
            transparent: true,
            opacity: 0.6,
            transmission: 0.5,
            roughness: 0.1
        });
        const basin = new THREE.Mesh(basinGeo, basinMat);
        basin.position.y = -2;
        coreGroup.add(basin);

        // Fuel Assemblies (Static)
        const fuelGeo = new THREE.BoxGeometry(0.5, 8, 0.5);
        const fuelMat = new THREE.MeshPhongMaterial({ color: 0x7f8c8d });

        for(let i=-2; i<=2; i++) {
            for(let j=-2; j<=2; j++) {
                if ((i+j)%2 === 0) { // Checkboard pattern
                    const fuel = new THREE.Mesh(fuelGeo, fuelMat);
                    fuel.position.set(i*1.5, -2, j*1.5);
                    coreGroup.add(fuel);
                }
            }
        }

        // Control Rods (Movable)
        const rodGeo = new THREE.BoxGeometry(0.4, 9, 0.4);
        const rodMat = new THREE.MeshPhongMaterial({ color: 0x34495e }); // Dark grey (Boron/Cadmium)
        const rods = [];

        for(let i=-2; i<=2; i++) {
            for(let j=-2; j<=2; j++) {
                if ((i+j)%2 !== 0) {
                    const rod = new THREE.Mesh(rodGeo, rodMat);
                    rod.position.set(i*1.5, 2, j*1.5); // Start halfway up
                    coreGroup.add(rod);
                    rods.push(rod);
                }
            }
        }

        // Particles (Neutrons)
        const particleGeo = new THREE.SphereGeometry(0.1, 8, 8);
        const particleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const particles = [];

        for(let i=0; i<50; i++) {
            const p = new THREE.Mesh(particleGeo, particleMat);
            p.visible = false;
            coreGroup.add(p);
            particles.push({
                mesh: p,
                active: false,
                vel: new THREE.Vector3()
            });
        }

        // --- Game Logic ---
        let rodPosition = 50; // 0 = fully in (cold), 100 = fully out (hot)
        let temperature = 50; // 0-100
        let rodDir = 0; // -1 = moving in, 1 = moving out

        function moveRods(dir) {
            rodDir = dir;
        }

        function stopRods() {
            rodDir = 0;
        }

        // Particle emission based on temp
        function emitNeutron() {
            const p = particles.find(p => !p.active);
            if (p) {
                p.active = true;
                p.mesh.visible = true;
                // Start near center bottom
                p.mesh.position.set((Math.random()-0.5)*4, -5 + Math.random()*2, (Math.random()-0.5)*4);
                // Random upward/outward velocity
                p.vel.set((Math.random()-0.5)*0.2, 0.1 + Math.random()*0.2, (Math.random()-0.5)*0.2);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / (window.innerHeight - 60);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight - 60);
        });

        // Animation Loop
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const now = performance.now();
            const dt = (now - lastTime) / 1000;
            lastTime = now;

            // 1. Move Rods
            if (rodDir !== 0) {
                rodPosition += rodDir * 20 * dt; // speed
                rodPosition = Math.max(0, Math.min(100, rodPosition));
            }

            // Visual update of rods (y from -2 (fully in) to 6 (fully out))
            const targetY = -2 + (rodPosition / 100) * 8;
            rods.forEach(rod => {
                rod.position.y += (targetY - rod.position.y) * 0.1; // Smooth interpolate
            });

            // 2. Physics / Temp Calculation
            // Rods out (100) = high reactivity. Target temp goes up.
            // Rods in (0) = low reactivity. Target temp goes down.
            // Natural cooling: slowly pulls temp down.

            const targetTemp = rodPosition * 1.2 - 10; // offset so 0 rods = cold
            temperature += (targetTemp - temperature) * 0.5 * dt;
            temperature = Math.max(0, Math.min(100, temperature));

            // 3. UI Update
            const tempBar = document.getElementById('temp-bar');
            tempBar.style.width = temperature + '%';

            const statusEl = document.getElementById('reactor-status');

            if (temperature > 85) {
                tempBar.style.backgroundColor = '#e74c3c';
                coreLight.color.setHex(0xe74c3c); // Red glow
                statusEl.innerText = t('danger_hot');
                statusEl.style.color = '#e74c3c';

                // Shake camera
                camera.position.x += (Math.random() - 0.5) * 0.1;
                camera.position.y += (Math.random() - 0.5) * 0.1;
            } else if (temperature < 20) {
                tempBar.style.backgroundColor = '#3498db';
                coreLight.color.setHex(0x2c3e50); // Dark
                statusEl.innerText = t('danger_cold');
                statusEl.style.color = '#3498db';
            } else {
                tempBar.style.backgroundColor = '#f1c40f';
                coreLight.color.setHex(0x3498db); // Blue glow
                statusEl.innerText = t('optimal');
                statusEl.style.color = '#2ecc71';
            }

            coreLight.intensity = (temperature / 100) * 2;

            // 4. Particle updates
            // Probability of emission depends on temp
            if (Math.random() < (temperature / 100) * 0.5) {
                emitNeutron();
            }

            particles.forEach(p => {
                if (p.active) {
                    p.mesh.position.add(p.vel);
                    // Fade / disappear if they hit top or bounds
                    if (p.mesh.position.y > 2 || p.mesh.position.length() > 6) {
                        p.active = false;
                        p.mesh.visible = false;
                    }
                }
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
