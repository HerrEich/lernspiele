<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggregatzustände im Teilchenmodell: Wasser </title>
    <style>
        :root {
            --primary: #2c3e50;
            --ice: #ade8f4;
            --water: #0077b6;
            --steam: #cbd5e0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        h1 { color: var(--primary); margin-bottom: 10px; font-size: 1.4rem; }

        #simulation-container {
            width: 600px;
            height: 400px;
            border: 5px solid var(--primary);
            border-radius: 12px;
            background: #ffffff;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        canvas { display: block; }

        #dpad {
            position: absolute;
            top: 15px;
            right: 15px;
            display: none; 
            grid-template-columns: 32px 32px 32px;
            grid-template-rows: 32px 32px 32px;
            gap: 4px;
            background: rgba(255, 255, 255, 0.8);
            padding: 8px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .pan-btn {
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: 0.1s;
        }
        .pan-btn:hover { background: #0077b6; transform: scale(1.1); }
        .pan-btn:active { transform: scale(0.9); }

        #panUp { grid-column: 2; grid-row: 1; }
        #panLeft { grid-column: 1; grid-row: 2; }
        #panRight { grid-column: 3; grid-row: 2; }
        #panDown { grid-column: 2; grid-row: 3; }
        #dpadCenter { grid-column: 2; grid-row: 2; background: transparent; cursor: default; }

        #ui-panel {
            width: 600px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            color: white;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .btn-ice { background-color: #48cae4; color: #03045e; }
        .btn-water { background-color: #0077b6; }
        .btn-steam { background-color: #909294; }
        .btn-forces { background-color: #fca311; color: #000; } 
        .btn-zoom { background-color: #8338ec; color: #fff; } 
        .btn-slowmo { background-color: #20c997; color: #000; } 
        .btn-pause { background-color: #e63946; }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
        }

        #tempSlider { flex-grow: 1; cursor: pointer; margin: 0 10px; }

        .status-badge {
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 6px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            min-width: 140px;
            text-align: center;
            font-size: 0.85rem;
        }

        .temp-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            min-width: 65px;
        }
    </style>
</head>
<body>

    <h1>Aggregatzustände im Teilchenmodell: Wasser</h1>

    <div id="simulation-container">
        <canvas id="canvas"></canvas>
        <div id="dpad">
            <button class="pan-btn" id="panUp">▲</button>
            <button class="pan-btn" id="panLeft">◀</button>
            <div id="dpadCenter"></div>
            <button class="pan-btn" id="panRight">▶</button>
            <button class="pan-btn" id="panDown">▼</button>
        </div>
    </div>

    <div id="ui-panel">
        <div class="btn-group">
            <button class="btn-ice" onclick="setPreset(-12)">Eis (Fest)</button>
            <button class="btn-water" onclick="setPreset(45)">Wasser (Flüssig)</button>
            <button class="btn-steam" onclick="setPreset(115)">Dampf (Gas)</button>
        </div>

        <div class="controls-row">
            <label style="font-weight: bold; font-size: 0.9rem;">Temp:</label>
            <input type="range" id="tempSlider" min="-20" max="120" value="45">
            <span id="tempVal" class="temp-text">45°C</span>
            <div id="stateBadge" class="status-badge">Zustand: Flüssig</div>
        </div>

        <div class="btn-group" style="margin-bottom: 0;">
            <button class="btn-forces" id="forcesBtn">Kräfte: AUS</button>
            <button class="btn-zoom" id="zoomBtn">Lupe: AUS</button>
            <button class="btn-slowmo" id="slowmoBtn">Zeitlupe: AUS</button>
            <button class="btn-pause" id="pauseBtn">Pause</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const tempSlider = document.getElementById('tempSlider');
    const tempVal = document.getElementById('tempVal');
    const stateBadge = document.getElementById('stateBadge');
    const pauseBtn = document.getElementById('pauseBtn');
    const forcesBtn = document.getElementById('forcesBtn');
    const zoomBtn = document.getElementById('zoomBtn');
    const slowmoBtn = document.getElementById('slowmoBtn');
    const dpad = document.getElementById('dpad');

    canvas.width = 600;
    canvas.height = 400;

    // --- Konfiguration ---
    const PARTICLE_COUNT = 600; 
    const RADIUS = 3.5;         
    let temperature = 45;
    
    let isPaused = false;
    let showForces = false; 
    let isZoomed = false; 
    let isSlowMo = false;

    // Kamera Setup
    const ZOOM_FACTOR = 3;
    let cameraX = canvas.width / 2;     
    let cameraY = canvas.height; 

    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    let particles = [];

    // --- Kamera Bewegung mit harten Grenzen ---
    function moveCamera(dx, dy) {
        cameraX += dx;
        cameraY += dy;
        
        const halfViewW = canvas.width / (ZOOM_FACTOR * 2);
        const halfViewH = canvas.height / (ZOOM_FACTOR * 2);

        const minX = halfViewW;
        const maxX = canvas.width - halfViewW;
        const minY = halfViewH;
        const maxY = canvas.height - halfViewH;

        cameraX = Math.max(minX, Math.min(maxX, cameraX));
        cameraY = Math.max(minY, Math.min(maxY, cameraY));
    }
    
    moveCamera(0, 0);

    class Particle {
        constructor(id) {
            this.id = id;
            this.x = Math.random() * (canvas.width - RADIUS * 2) + RADIUS;
            this.y = Math.random() * (canvas.height - RADIUS * 2) + RADIUS;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = (Math.random() - 0.5) * 2;
            
            const cols = 30;
            const spacing = RADIUS * 2.15;
            const startX = (canvas.width / 2) - (cols * spacing / 2);
            this.gridX = startX + (id % cols) * spacing;
            this.gridY = (canvas.height - 15) - Math.floor(id / cols) * spacing;
        }

        update() {
            if (isPaused) return;

            let dt = isSlowMo ? 0.15 : 1; 
            let sqrtDt = Math.sqrt(dt);

            if (temperature <= 0) {
                // FEST
                let dx = this.gridX - this.x;
                let dy = this.gridY - this.y;
                
                this.vx += dx * 0.12 * dt; 
                this.vy += dy * 0.12 * dt;
                
                let friction = Math.pow(0.3, dt);
                this.vx *= friction; 
                this.vy *= friction;
                
                let jiggle = (temperature + 21) * 0.04;
                this.vx += (Math.random() - 0.5) * jiggle * sqrtDt;
                this.vy += (Math.random() - 0.5) * jiggle * sqrtDt;

            } else if (temperature < 100) {
                // FLÜSSIG
                this.vy += 0.2 * dt; 
                
                let friction = Math.pow(0.99, dt); 
                this.vx *= friction; 
                
                let speedScale = 0.4 + (temperature * 0.045); 
                this.vx += (Math.random() - 0.5) * speedScale * sqrtDt;
                this.vy += (Math.random() - 0.5) * speedScale * sqrtDt;

                const limit = 4 + (temperature / 15);
                this.vx = Math.max(Math.min(this.vx, limit), -limit);
                this.vy = Math.max(Math.min(this.vy, limit), -limit);

            } else {
                // GAS
                let energy = (temperature - 100) * 0.6 + 5;
                this.vx += (Math.random() - 0.5) * energy * sqrtDt;
                this.vy += (Math.random() - 0.5) * energy * sqrtDt;
                
                const limit = 16;
                this.vx = Math.max(Math.min(this.vx, limit), -limit);
                this.vy = Math.max(Math.min(this.vy, limit), -limit);
            }

            this.x += this.vx * dt;
            this.y += this.vy * dt;

            // Wände
            if (this.x - RADIUS < 0) { this.x = RADIUS; this.vx *= -0.6; }
            if (this.x + RADIUS > canvas.width) { this.x = canvas.width - RADIUS; this.vx *= -0.6; }
            if (this.y - RADIUS < 0) { this.y = RADIUS; this.vy *= -0.6; }
            if (this.y + RADIUS > canvas.height) { this.y = canvas.height - RADIUS; this.vy *= -0.6; }

            // Kollisionen
            for (let i = this.id + 1; i < particles.length; i++) {
                let other = particles[i];
                let dx = other.x - this.x;
                let dy = other.y - this.y;
                let minDist = RADIUS * 2;
                
                if (Math.abs(dx) < minDist && Math.abs(dy) < minDist) {
                    let distSq = dx*dx + dy*dy;
                    if (distSq < minDist * minDist) {
                        let dist = Math.sqrt(distSq) || 1;
                        let overlap = (minDist - dist) / 2;
                        let nx = dx / dist;
                        let ny = dy / dist;

                        this.x -= nx * overlap;
                        this.y -= ny * overlap;
                        other.x += nx * overlap;
                        other.y += ny * overlap;

                        let bounce = temperature > 0 ? 0.5 : 0.05;
                        this.vx *= -bounce;
                        this.vy *= -bounce;
                    }
                }
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, RADIUS, 0, Math.PI * 2);
            // Die Farbe bleibt jetzt immer gleich, egal welche Temperatur eingestellt ist!
            ctx.fillStyle = "#0077b6"; 
            ctx.fill();
            ctx.closePath();
        }
    }

    function init() {
        particles =[];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle(i));
        }
        loop();
    }

    // --- Maussteuerung Events ---
    canvas.addEventListener('mousedown', (e) => {
        if (!isZoomed) return;
        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        canvas.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging || !isZoomed) return;
        
        let dx = e.clientX - dragStartX;
        let dy = e.clientY - dragStartY;
        
        dragStartX = e.clientX;
        dragStartY = e.clientY;

        moveCamera(-dx / ZOOM_FACTOR, -dy / ZOOM_FACTOR);
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
        if (isZoomed) canvas.style.cursor = 'grab';
    });

    // --- D-Pad Events ---
    document.getElementById('panUp').onclick = () => moveCamera(0, -30);
    document.getElementById('panDown').onclick = () => moveCamera(0, 30);
    document.getElementById('panLeft').onclick = () => moveCamera(-30, 0);
    document.getElementById('panRight').onclick = () => moveCamera(30, 0);

    // --- UI Events ---
    function setPreset(val) {
        tempSlider.value = val;
        updateTemp();
    }

    function updateTemp() {
        temperature = parseInt(tempSlider.value);
        tempVal.innerText = temperature + "°C";
        
        if (temperature <= 0) {
            stateBadge.innerText = "Zustand: Eis";
            stateBadge.style.color = "#00b4d8";
        } else if (temperature < 100) {
            stateBadge.innerText = "Zustand: Flüssig";
            stateBadge.style.color = "#0077b6";
        } else {
            stateBadge.innerText = "Zustand: Gasförmig";
            stateBadge.style.color = "#909294";
        }
    }

    tempSlider.oninput = updateTemp;
    
    pauseBtn.onclick = () => {
        isPaused = !isPaused;
        pauseBtn.innerText = isPaused ? "Weiter" : "Pause";
        pauseBtn.style.backgroundColor = isPaused ? "#2a9d8f" : "#e63946";
    };

    forcesBtn.onclick = () => {
        showForces = !showForces;
        forcesBtn.innerText = showForces ? "Kräfte: EIN" : "Kräfte: AUS";
        forcesBtn.style.backgroundColor = showForces ? "#14213d" : "#fca311";
        forcesBtn.style.color = showForces ? "#fff" : "#000";
    };

    zoomBtn.onclick = () => {
        isZoomed = !isZoomed;
        zoomBtn.innerText = isZoomed ? "Lupe: EIN" : "Lupe: AUS";
        zoomBtn.style.backgroundColor = isZoomed ? "#3a0ca3" : "#8338ec";
        
        dpad.style.display = isZoomed ? 'grid' : 'none';
        canvas.style.cursor = isZoomed ? 'grab' : 'default';
        
        if(!isZoomed) {
            cameraX = canvas.width / 2;
            cameraY = canvas.height;
            moveCamera(0, 0);
        }
    };

    slowmoBtn.onclick = () => {
        isSlowMo = !isSlowMo;
        slowmoBtn.innerText = isSlowMo ? "Zeitlupe: EIN" : "Zeitlupe: AUS";
        slowmoBtn.style.backgroundColor = isSlowMo ? "#128260" : "#20c997";
        slowmoBtn.style.color = isSlowMo ? "#fff" : "#000";
    };

    function drawForces() {
        const threshold = 18; 
        const thresholdSq = threshold * threshold;
        
        ctx.lineWidth = 0.5;
        ctx.strokeStyle = "rgba(0, 119, 182, 0.35)"; 
        
        ctx.beginPath();
        for (let i = 0; i < particles.length; i++) {
            let p1 = particles[i];
            for (let j = i + 1; j < particles.length; j++) {
                let p2 = particles[j];
                
                let dx = p1.x - p2.x;
                if (Math.abs(dx) > threshold) continue; 
                
                let dy = p1.y - p2.y;
                if (Math.abs(dy) > threshold) continue;

                if (dx*dx + dy*dy < thresholdSq) {
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                }
            }
        }
        ctx.stroke();
    }

    // --- Render-Loop ---
    function loop() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0,0, canvas.width, canvas.height);

        particles.forEach(p => p.update());

        ctx.save();
        if (isZoomed) {
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(ZOOM_FACTOR, ZOOM_FACTOR);
            ctx.translate(-cameraX, -cameraY);
        }

        if (showForces) drawForces();
        particles.forEach(p => p.draw());

        ctx.restore();
        requestAnimationFrame(loop);
    }

    init();
    updateTemp();
</script>
</body>
</html>
