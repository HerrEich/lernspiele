ically. Model speed: HDD 125 bits/s · SSD 500 bits/s.',racePower:'Turn the power back on first.',raceInterrupted:'Power off: the race was canceled. Start it again after powering on.',quizTitle:'Show what you know',quizDesc:'Five questions. Get an explanation right away. Correct answers light up stars.',quizCounter:'Question {n} of 5 · {score} stars',next:'Next question',finish:'See results',correct:'Correct! {explain}',wrong:'Not quite. {explain}',quizResult:'You earned {score} of 5 stars!',quizBest:'Your best result: {best} of 5 stars.',quizRetry:'Play quiz again',missionsTitle:'Your missions',badgesTitle:'Achievements',didYouKnow:'Good to know',persistenceNote:'HDDs and SSDs retain data without power. Your game progress is saved in this browser on this device.',restart:'Reset progress',restartConfirm:'Delete all missions, achievements, and quiz results?',footer:'BIT LAB · Understanding storage · Classroom model',mHdd1:'HDD: save bit 1',mHdd0:'HDD: save bit 0',mHddShake:'HDD: shake test',mSsd1:'SSD: save bit 1',mSsd0:'SSD: save bit 0',mSsdShake:'SSD: shake test',mPower:'Power off and on again',mRace:'Finish the data race',mQuiz:'Finish the quiz',lockedStatus:"Locked",unlockedStatus:"Unlocked",doneStatus:"Done",openStatus:"Open",bMagnet:'Magnet expert',bFlash:'Flash explorer',bPower:'Data saver',bRace:'Speed checker',bQuiz:'Quiz star',unlocked:'Achievement unlocked: {name}!',q:[

    function play(type){if(!state.sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type=type==='click'?'square':'sine';const f=type==='click'?190:type==='win'?780:type==='wrong'?230:500;o.frequency.setValueAtTime(f,now);if(type==='win')o.frequency.exponentialRampToValueAtTime(1100,now+.15);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(type==='click'?.09:.05,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+(type==='click'?.08:.24));o.start(now);o.stop(now+(type==='click'?.09:.25))}catch{}}
    function announce(message){$('announcement').textContent='';requestAnimationFrame(()=>$('announcement').textContent=message)}
    function award(){for(const [key,,label,rule] of BADGES){if(rule(state)&&!state.badges.includes(key)){state.badges.push(key);announce(tr('unlocked',{name:tr(label)}));play('win')}}}
    function mission(key){if(!state.missions[key]){state.missions[key]=true;award();persist();renderProgress()}}
    function currentLevel(){const m=state.missions;if(!(m.hdd1&&m.hdd0&&m.hddShake))return 1;if(!(m.ssd1&&m.ssd0&&m.ssdShake&&m.power))return 2;if(!m.race)return 3;return 4}
    function renderProgress(){const done=KEYS.filter(k=>state.missions[k]).length;$('level-label').textContent=tr('level',{n:currentLevel()});$('xp-label').textContent=tr('xp',{n:done*10});$('progress-label').textContent=tr('progress',{done});$('overall-fill').style.width=(done/9*100)+'%';$('overall-progress').setAttribute('aria-valuenow',done);for(const [key,rule] of [['hdd',state.missions.hdd1&&state.missions.hdd0&&state.missions.hddShake],['ssd',state.missions.ssd1&&state.missions.ssd0&&state.missions.ssdShake&&state.missions.power],['race',state.missions.race],['quiz',state.missions.quiz]]){$('check-'+key).textContent=rule?'✓':'';$('tab-'+key+'-small').textContent=tr('level',{n:{hdd:1,ssd:2,race:3,quiz:4}[key]})}const list=$('mission-list');list.replaceChildren();for(const key of KEYS){const row=document.createElement('div');row.className='mission'+(state.missions[key]?' done':'');row.setAttribute("aria-label",tr("m"+key[0].toUpperCase()+key.slice(1))+": "+tr(state.missions[key]?"doneStatus":"openStatus"));const dot=document.createElement('span');dot.className='dot';dot.textContent=state.missions[key]?'✓':'○';dot.setAttribute('aria-hidden','true');row.append(dot,document.createTextNode(tr('m'+key[0].toUpperCase()+key.slice(1))));list.append(row)}const badges=$('badge-grid');badges.replaceChildren();for(const [key,icon,label] of BADGES){const card=document.createElement('div');card.className='badge'+(state.badges.includes(key)?' earned':'');const symbol=document.createElement('b');symbol.textContent=icon;symbol.setAttribute('aria-hidden','true');card.setAttribute("aria-label",tr(label)+": "+tr(state.badges.includes(key)?"unlockedStatus":"lockedStatus"));card.append(symbol,document.createTextNode(tr(label)));badges.append(card)}}
    function renderBits(){$('hdd-magnet').dataset.bit=state.hddBit===null?'empty':String(state.hddBit);$('hdd-direction').textContent=tr(state.hddBit===null?'directionEmpty':state.hddBit?'directionOne':'directionZero');$('hdd-viz').classList.toggle('writing',hddBusy);$('ssd-power-toggle').textContent=tr(state.powered?'powerOff':'powerOn');$('hdd-bit-spot').textContent=state.hddBit===null?'–':state.hddBit;$('hdd-bit-spot').setAttribute('aria-label',state.hddBit===null?'':String(state.hddBit));const cells=$('ssd-board').children;for(let i=0;i<cells.length;i++){const active=i===5&&state.ssdBit===1;cells[i].classList.toggle('active',active);cells[i].querySelector('.cell-bit').textContent=i===5&&state.ssdBit!==null?state.ssdBit:''}$('hdd-feedback').textContent=tr(feedback.hdd);$('hdd-feedback').className='feedback'+(feedback.hdd==='hddCrash'?' warn':feedback.hdd.startsWith('hddSaved')?' success':'');$('ssd-feedback').textContent=tr(feedback.ssd);$('ssd-feedback').className='feedback'+(feedback.ssd==='ssdShake'?' warn':' success');$('power-toggle').textContent=tr(state.powered?'powerOff':'powerOn');$('power-note').textContent=tr(feedback.power);$('ssd-power-note').textContent=tr(state.powered?'ssdPowerOn':'ssdPowerOff');$('power-indicator').classList.toggle('off',!state.powered);$('ssd-power-indicator').classList.toggle('off',!state.powered);$('hdd-viz').classList.toggle('power-off',!state.powered);for(const id of ["hdd-one","hdd-zero"])$(id).disabled=!state.powered||hddBusy;for(const id of ["ssd-one","ssd-zero"])$(id).disabled=!state.powered;$('race-start').disabled=race.running||!state.powered}
    function setTab(tab){state.tab=tab;for(const name of ['hdd','ssd','race','quiz']){$('panel-'+name).hidden=name!==tab;$('tab-'+name).setAttribute('aria-pressed',String(name===tab))}persist()}
    function renderRace(){const hd=Math.min(1000,Math.floor(race.hdd*1000)),sd=Math.min(1000,Math.floor(race.ssd*1000));$('race-hdd-fill').style.width=race.hdd*100+'%';$('race-ssd-fill').style.width=race.ssd*100+'%';for(const [name,n] of [['hdd',hd],['ssd',sd]]){$('race-'+name+'-number').textContent=new Intl.NumberFormat(state.lang==='de'?'de-DE':'en-GB').format(n)+' / '+new Intl.NumberFormat(state.lang==='de'?'de-DE':'en-GB').format(1000);$('race-'+name+'-bar').setAttribute('aria-valuenow',n)}$('hdd-lane').classList.toggle('running',race.running&&race.hdd<1);$('race-hdd-time').textContent=race.complete?tr('raceTime',{n:8}):tr('raceIdle');$('race-ssd-time').textContent=race.complete?tr('raceTime',{n:2}):tr('raceIdle');$('race-result').hidden=!(race.complete||race.message);$('race-result').textContent=race.message?tr(race.message):race.complete?tr('raceResult'):'';$('race-metrics').hidden=!race.complete;$('race-metrics').textContent=race.complete?tr('raceMetrics'):'';$('race-start').textContent=tr(race.running?'raceRunning':race.complete?'raceAgain':'raceStart');$('race-start').disabled=race.running||!state.powered}
    function renderQuiz(){const done=state.quizDone||state.quizIndex>=5;$('quiz-body').hidden=done;$('quiz-end').hidden=!done;if(done){$('quiz-stars').textContent='★'.repeat(state.quizScore)+'☆'.repeat(5-state.quizScore);$('quiz-stars').setAttribute('aria-label',tr('quizResult',{score:state.quizScore}));$('quiz-result').textContent=tr('quizResult',{score:state.quizScore});$('quiz-best').textContent=tr('quizBest',{best:state.best});return}const q=T[state.lang].q[state.quizIndex];$('quiz-counter').textContent=tr('quizCounter',{n:state.quizIndex+1,score:state.quizScore});$('quiz-question').textContent=q.ask;const options=$('quiz-options');options.replaceChildren();q.options.forEach((choice,index)=>{const btn=document.createElement('button');btn.type='button';btn.className='option';if(state.quizAnswered){if(index===q.answer)btn.classList.add("correct");else if(index===state.quizSelected)btn.classList.add("wrong")}btn.disabled=state.quizAnswered;const letter=document.createElement('span');letter.className='option-letter';letter.textContent=String.fromCharCode(65+index);letter.setAttribute('aria-hidden','true');btn.append(letter,document.createTextNode(choice));btn.addEventListener('click',()=>answer(index));options.append(btn)});$('quiz-feedback').hidden=!state.quizAnswered;$('quiz-feedback').className='feedback'+(state.quizSelected===q.answer?' success':' warn');$('quiz-feedback').textContent=state.quizAnswered?tr(state.quizSelected===q.answer?'correct':'wrong',{explain:q.explain}):'';$('quiz-next').hidden=!state.quizAnswered;$('quiz-next').textContent=tr(state.quizIndex===4?'finish':'next')}
    function render(){document.documentElement.lang=state.lang;document.title=state.lang==='de'?'Bits bleiben! · HDD & SSD':'Bits stay! · HDD & SSD';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=tr(el.dataset.i18nHtml));$('lang-group').setAttribute('aria-label',tr('language'));$('lang-de').setAttribute('aria-pressed',String(state.lang==='de'));$('lang-en').setAttribute('aria-pressed',String(state.lang==='en'));$('sound-toggle').textContent=tr(state.sound?'soundOn':'soundOff');$('hdd-one').textContent=tr('hddOne');$('hdd-zero').textContent=tr('hddZero');$('ssd-one').textContent=tr('hddOne');$('ssd-zero').textContent=tr('hddZero');$('hdd-shake').textContent=tr('shake');$('ssd-shake').textContent=tr('shake');$('restart').textContent=tr('restart');$('quiz-retry').textContent=tr('quizRetry');document.querySelectorAll('[data-say]').forEach(btn=>btn.textContent=tr(speaking?'stopSpeak':'speak'));renderProgress();renderBits();renderRace();renderQuiz();setTab(state.tab)}
    function hddWrite(bit){if(!state.powered){feedback.hdd='powerNeed';renderBits();return}if(hddBusy)return;hddBusy=true;feedback.hdd='hddWriting';$('hdd-arm').classList.add('seek');play('click');renderBits();hddTimer=setTimeout(()=>{state.hddBit=bit;hddBusy=false;$('hdd-arm').classList.remove('seek');feedback.hdd=bit?'hddSaved1':'hddSaved0';mission(bit?'hdd1':'hdd0');persist();renderBits()},750)}
    function ssdWrite(bit){if(!state.powered){feedback.ssd='powerNeed';renderBits();return}state.ssdBit=bit;feedback.ssd=bit?'ssdSaved1':'ssdSaved0';const cell=$('ssd-board').children[5];cell.classList.remove('pulse');void cell.offsetWidth;cell.classList.add('pulse');mission(bit?'ssd1':'ssd0');persist();renderBits()}
    function powerToggle(){state.powered=!state.powered;if(!state.powered){state.powerWasOff=true;feedback.power='powerLost';if(hddBusy){clearTimeout(hddTimer);hddBusy=false;$('hdd-arm').classList.remove('seek');feedback.hdd='hddCanceled'}if(race.running){cancelAnimationFrame(race.raf);race.running=false;race.complete=false;race.hdd=0;race.ssd=0;race.message='raceInterrupted'}}else{feedback.power='powerBack';if(state.powerWasOff)mission('power')}persist();renderBits();renderRace()}
    function startRace(){if(race.running)return;if(!state.powered){race.message='racePower';renderRace();return}race={running:true,complete:false,start:performance.now(),hdd:0,ssd:0,raf:0,message:null};renderRace();const tick=now=>{if(!race.running)return;const sec=(now-race.start)/1000;race.ssd=Math.min(1,sec/2);const seek=Math.min(10,Math.floor(sec/.8)),phase=Math.max(0,Math.min(1,(sec% .8)/.8-.25)/.75);race.hdd=Math.min(1,(seek+phase)/10);if(race.hdd>=1){race.running=false;race.complete=true;mission('race');play('win')}renderRace();if(race.running)race.raf=requestAnimationFrame(tick)};race.raf=requestAnimationFrame(tick)}
    function answer(index){if(state.quizAnswered||state.quizDone)return;const q=T[state.lang].q[state.quizIndex];state.quizSelected=index;state.quizAnswered=true;if(index===q.answer){state.quizScore++;play('win')}else play('wrong');persist();renderQuiz()}
    function nextQuestion(){if(!state.quizAnswered)return;if(state.quizIndex===4){state.quizDone=true;state.quizIndex=5;state.best=Math.max(state.best,state.quizScore);mission('quiz');play('win')}else{state.quizIndex++;state.quizAnswered=false;state.quizSelected=null}persist();renderQuiz()}
    function stopSpeech(){if('speechSynthesis'in window)window.speechSynthesis.cancel();speaking=false;document.querySelectorAll('[data-say]').forEach(btn=>btn.textContent=tr('speak'))}
    function speak(tab){if(!('speechSynthesis'in window)){announce(state.lang==='de'?'Vorlesen ist in diesem Browser nicht verfügbar.':'Read aloud is unavailable in this browser.');return}if(speaking){stopSpeech();return}const key={hdd:'hddDesc',ssd:'ssdDesc',race:'raceDesc',quiz:'quizDesc'}[tab];const content=['hdd','ssd'].includes(tab)?[key,'tryTitle',tab+'Step1',tab+'Step2',tab+'Step3',tab+'Model'].map(k=>tr(k)).join(' '):tab==='quiz'&&!state.quizDone?tr(key)+' '+T[state.lang].q[state.quizIndex].ask:tr(key);const utterance=new SpeechSynthesisUtterance(content);utterance.lang=state.lang==='de'?'de-DE':'en-GB';utterance.rate=.9;utterance.onend=utterance.onerror=()=>{speaking=false;document.querySelectorAll('[data-say]').forEach(btn=>btn.textContent=tr('speak'))};speaking=true;document.querySelectorAll('[data-say]').forEach(btn=>btn.textContent=tr('stopSpeak'));window.speechSynthesis.speak(utterance)}
    function setup(){const board=$('ssd-board');for(let i=0;i<16;i++){const cell=document.createElement('div');cell.className='cell'+(i===5?' selected':'');const electron=document.createElement('span');electron.className='electron';electron.textContent='•••';const bit=document.createElement('span');bit.className='cell-bit';cell.append(electron,bit);board.append(cell)}for(const tab of ['hdd','ssd','race','quiz'])$('tab-'+tab).addEventListener('click',()=>{stopSpeech();setTab(tab)});$('lang-de').addEventListener('click',()=>{stopSpeech();state.lang='de';persist();render()});$('lang-en').addEventListener('click',()=>{stopSpeech();state.lang='en';persist();render()});$('sound-toggle').addEventListener('click',()=>{state.sound=!state.sound;persist();render()});$('hdd-one').addEventListener('click',()=>hddWrite(1));$('hdd-zero').addEventListener('click',()=>hddWrite(0));$('hdd-shake').addEventListener('click',()=>{feedback.hdd='hddCrash';$('hdd-viz').classList.remove('shock');void $('hdd-viz').offsetWidth;$('hdd-viz').classList.add('shock');play('click');mission('hddShake');renderBits()});$('ssd-one').addEventListener('click',()=>ssdWrite(1));$('ssd-zero').addEventListener('click',()=>ssdWrite(0));$('ssd-shake').addEventListener('click',()=>{feedback.ssd='ssdShake';mission('ssdShake');renderBits()});$('power-toggle').addEventListener('click',powerToggle);$('ssd-power-toggle').addEventListener('click',powerToggle);$('race-start').addEventListener('click',startRace);$('quiz-next').addEventListener('click',nextQuestion);$('quiz-retry').addEventListener('click',()=>{state.quizIndex=0;state.quizScore=0;state.quizAnswered=false;state.quizSelected=null;state.quizDone=false;persist();renderQuiz()});$('restart').addEventListener('click',()=>{if(!confirm(tr('restartConfirm')))return;clearTimeout(hddTimer);cancelAnimationFrame(race.raf);stopSpeech();const lang=state.lang,sound=state.sound;state=initial();state.lang=lang;state.sound=sound;feedback={hdd:'hddDefault',ssd:'ssdDefault',power:'powerDefault'};race={running:false,complete:false,start:0,hdd:0,ssd:0,raf:0,message:null};hddBusy=false;persist();render()});document.querySelectorAll('[data-say]').forEach(btn=>btn.addEventListener('click',()=>speak(btn.dataset.say)));render()}
    function runSelfChecks(){const results=[];const check=(name,condition)=>{if(!condition)throw Error(name);results.push(name)};check('nine unique missions',KEYS.length===9&&new Set(KEYS).size===9);check('five matching questions',T.de.q.length===5&&T.en.q.length===5&&T.de.q.every((q,i)=>q.options.length===T.en.q[i].options.length&&q.answer>=0&&q.answer<q.options.length));check('translation keys match',Object.keys(T.de).sort().join('|')===Object.keys(T.en).sort().join('|'));check('all mission labels translated',KEYS.every(k=>T.de['m'+k[0].toUpperCase()+k.slice(1)]&&T.en['m'+k[0].toUpperCase()+k.slice(1)]));check('four levels',Object.keys({hdd:1,ssd:2,race:3,quiz:4}).length===4);check('six translated experiment steps',['de','en'].every(lang=>['hdd','ssd'].every(tab=>[1,2,3].every(n=>typeof T[lang][tab+'Step'+n]==='string'&&T[lang][tab+'Step'+n].length>20))));check('all diagram and instruction labels translated',[...document.querySelectorAll('[data-i18n]')].every(el=>['de','en'].every(lang=>typeof T[lang][el.dataset.i18n]==='string')));return results}
    window.storageGame={runSelfChecks,getState:()=>structuredClone(state)};
    setup();if(new URLSearchParams(location.search).has('selftest'))console.info('BIT LAB self-checks:',runSelfChecks());
