<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WP-NW: Analog-Digital-Wandler Simulation</title>
<style>
body { font-family: sans-serif; background: #f0f4f8; display: flex; flex-direction: column; align-items: center; padding: 20px; }
.card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 800px; width: 100%; }
h2 { color: #2c3e50; margin-top: 0; }
canvas { background: #fff; border: 1px solid #ccc; width: 100%; height: 400px; border-radius: 4px; }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; background: #ecf0f1; padding: 15px; border-radius: 8px; }
.control-group { display: flex; flex-direction: column; }
label { font-weight: bold; margin-bottom: 5px; color: #34495e; }
input[type="range"] { cursor: pointer; }
.stats { margin-top: 10px; font-size: 0.9em; color: #7f8c8d; }
.legend { display: flex; gap: 15px; margin-bottom: 10px; font-size: 0.85em; }
.legend-item { display: flex; align-items: center; gap: 5px; }
.box { width: 12px; height: 12px; border-radius: 2px; }
</style>
</head>
<body>
<div class="card">
<h2>Interaktives Signal-Labor</h2>
<p>Verändere die Regler, um zu sehen, wie ein analoges Signal (Welle) in ein digitales Signal (Stufen) umgewandelt wird.</p>
<div class="legend">
<div class="legend-item"><div class="box" style="background: #3498db;"></div> Analoges Signal</div>
<div class="legend-item"><div class="box" style="background: rgba(231, 76, 60, 0.6);"></div> Digitalisiertes Signal</div>
</div>
<canvas id="canvas"></canvas>
<div class="controls">
<div class="control-group">
<label for="sampling">Abtastrate (Zeitabstände)</label>
<input type="range" id="sampling" min="4" max="80" value="12">
<div class="stats">Punkte pro Schwingung: <span id="val-sampling">12</span></div>
</div>
<div class="control-group">
<label for="bits">Bittiefe (Genauigkeit)</label>
<input type="range" id="bits" min="1" max="6" value="2">
<div class="stats">Verfügbare Stufen ($2^n$): <span id="val-bits">4</span></div>
</div>
</div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const samplingInput = document.getElementById('sampling');
const bitsInput = document.getElementById('bits');
// Canvas Größe anpassen
function resize() {
canvas.width = canvas.offsetWidth * window.devicePixelRatio;
canvas.height = canvas.offsetHeight * window.devicePixelRatio;
draw();
}
function draw() {
const w = canvas.width;
const h = canvas.height;
const padding = 50;
const centerY = h / 2;
const amplitude = h * 0.35;
ctx.clearRect(0, 0, w, h);
const samplingRate = parseInt(samplingInput.value);
const bits = parseInt(bitsInput.value);
const levels = Math.pow(2, bits);
document.getElementById('val-sampling').innerText = samplingRate;
document.getElementById('val-bits').innerText = levels;
// 1. Koordinatensystem zeichnen
ctx.strokeStyle = '#bdc3c7';
ctx.beginPath();
ctx.moveTo(padding, centerY); ctx.lineTo(w - padding, centerY); // X-Achse
ctx.moveTo(padding, padding); ctx.lineTo(padding, h - padding); // Y-Achse
ctx.stroke();
// 2. Analoges Signal (Sinuskurve)
ctx.strokeStyle = '#3498db';
ctx.lineWidth = 3;
ctx.beginPath();
for (let x = padding; x < w - padding; x++) {
const t = (x - padding) / (w - 2 * padding);
const y = centerY + Math.sin(t * Math.PI * 2) * amplitude;
if (x === padding) ctx.moveTo(x, y);
else ctx.lineTo(x, y);
}
ctx.stroke();
// 3. Digitalisierung (Abtastung und Quantisierung)
const stepX = (w - 2 * padding) / samplingRate;
for (let i = 0; i < samplingRate; i++) {
const x = padding + i * stepX;
const t = (x - padding) / (w - 2 * padding);
// Analoger Wert an diesem Punkt
const analogY = Math.sin(t * Math.PI * 2);
// Quantisierung: Wert auf die nächste "Bit-Stufe" zwingen
// Wir normalisieren den Sinus (-1 bis 1) auf 0 bis 1 und stufen ihn dann ab
const quantizedY = Math.round(((analogY + 1) / 2) * (levels - 1)) / (levels - 1);
const finalY = centerY + (quantizedY * 2 - 1) * amplitude;
// Zeichne digitale Säule (wie im Buch Bild 4/5)
ctx.fillStyle = 'rgba(231, 76, 60, 0.6)';
ctx.strokeStyle = '#c0392b';
ctx.lineWidth = 1;
const barWidth = stepX * 0.8;
ctx.fillRect(x, finalY, barWidth, centerY - finalY);
ctx.strokeRect(x, finalY, barWidth, centerY - finalY);
// Messpunkt markieren
ctx.fillStyle = '#c0392b';
ctx.beginPath();
ctx.arc(x + barWidth/2, finalY, 4, 0, Math.PI * 2);
ctx.fill();
}
}
[samplingInput, bitsInput].forEach(input => input.addEventListener('input', draw));
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
